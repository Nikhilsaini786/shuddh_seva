<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Shuddh Seva Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a210f;
      --primary-dark: #321408;
      --accent: #176b3b;
      --gold: #c8a34b;
      --bg: #f5f2ea;
      --card: #ffffff;
      --text: #221711;
      --text-muted: #6f6760;
      --border: #e3dcd1;
      --danger: #c53030;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 38px 34px;
      box-shadow: 0 18px 40px rgba(74, 33, 15, 0.08);
      text-align: center;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: #fcf8ee;
      border-radius: 50%;
      color: var(--primary);
      font-size: 30px;
      margin-bottom: 14px;
      border: 2px solid var(--gold);
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 22px;
    }
    .badge-direct {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef7ed;
      color: var(--accent);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      border: 1px solid #c8e6c9;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 33, 15, 0.1);
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background: var(--primary-dark);
    }
    .alert-box {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 18px;
      text-align: left;
      display: none;
    }
    .alert-box.error {
      background: #fde8e8;
      border: 1px solid #f8b4b4;
      color: #9b1c1c;
    }
    .alert-box.success {
      background: #edf7ed;
      border: 1px solid #b7ebc2;
      color: #1e4620;
    }
    .admin-info-badge {
      background: #faf8f5;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 22px;
      text-align: left;
      line-height: 1.5;
    }
    .admin-info-badge strong {
      color: var(--primary);
    }
    .quick-fill-btn {
      background: #fdfaf3;
      border: 1px solid var(--gold);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
    }
    .back-store {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .back-store:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo">🌿</div>
      <h1>SHUDDH SEVA</h1>
      <p class="subtitle">Store Owner Administration Portal</p>

      <div class="badge-direct">
        👑 Direct Store Owner Access
      </div>

      {% if error %}
      <div class="alert-box error" style="display:block;">⚠️ {{ error }}</div>
      {% endif %}

      <div class="alert-box" id="loginAlert"></div>

      <!-- DIRECT ADMIN LOGIN FORM -->
      <form id="adminLoginForm" method="POST" action="/admin/login" onsubmit="handleDirectLogin(event)">
        <div class="form-group">
          <label for="adminIdentifier">Admin Mobile, Email, or ID</label>
          <input type="text" id="adminIdentifier" name="identifier" placeholder="6350474290 or infosevaspice@gmail.com" value="6350474290" required autofocus>
        </div>

        <div class="form-group">
          <label for="adminPassword">Admin Security Password</label>
          <input type="password" id="adminPassword" name="password" placeholder="Enter admin password" required>
        </div>

        <button type="submit" class="btn" id="btnLogin">
          Open Admin Dashboard (डायरेक्ट एडमिन पेज खोलें) 🚀
        </button>
      </form>

      <div class="admin-info-badge">
        👤 <b>Registered Store Administrator:</b><br>
        Name: <strong>Ankit</strong><br>
        Mobile: <strong>+91 6350474290</strong><br>
        Email: <strong>infosevaspice@gmail.com</strong><br>
        <button type="button" class="quick-fill-btn" onclick="fillAdminCreds()">
          ⚡ Quick Auto-Fill Credentials
        </button>
      </div>

      <div>
        <a href="/" class="back-store">← Return to Shuddh Seva Store</a>
      </div>
    </div>
  </div>

  <script>
    function fillAdminCreds() {
      document.getElementById('adminIdentifier').value = '6350474290';
      document.getElementById('adminPassword').value = 'Shuddh@Admin2026!';
      showAlert('✓ Credentials prefilled! Click "Open Admin Dashboard" to login.', 'success');
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('loginAlert');
      el.className = `alert-box ${type}`;
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    function hideAlert() {
      const el = document.getElementById('loginAlert');
      el.style.display = 'none';
      el.innerHTML = '';
    }

    async function handleDirectLogin(e) {
      e.preventDefault();
      hideAlert();

      const identifier = document.getElementById('adminIdentifier').value.trim();
      const password = document.getElementById('adminPassword').value;

      if (!identifier || !password) {
        showAlert('Please enter both identifier and password.');
        return;
      }

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        if (data.success) {
          showAlert(`✓ Authentication successful! Loading dashboard...`, 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/admin/dashboard';
          }, 400);
        } else {
          showAlert(data.error || 'Incorrect admin password or email/phone.');
        }
      } catch (err) {
        // Fallback to standard form submit
        document.getElementById('adminLoginForm').submit();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Open Admin Dashboard (डायरेक्ट एडमिन पेज खोलें) 🚀';
      }
    }
  </script>
</body>
</html>
